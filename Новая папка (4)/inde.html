<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <div class="page">
        <header class="head">
            
<picture>
        <source srcset="./foto/kart.avif" type="foto/avif">
        <source srcset="./foto/kart.webp" type="foto/webp">
        <img class="logo_ing" src="./foto/kart.jpg" alt="Лого">
    </picture>
  <nav class="menu">
        <a class="sk">Home</a>
        <a class="sk">Homework</a>
        <a class="sk">Настройки</a>
    </nav>
    <picture>
        <source srcset="./foto/logo.avif" type="foto/avif">
        <source srcset="./foto/logo.webp" type="foto/webp">
        <img class="lico_ing" src="./foto/logo.jpg" alt="лицо">
    </picture>
</header>

   <main class="main">
        <h1 class="title">Settings</h1>


        <div class="tabs-wrap">
            <div class="tabs">
                <button class="tab active" >AVATAR</button>
                <button class="tab">STUDENT'S INFO</button>
                <button class="tab" >CHANGE PASSWORD</button>
            </div>
        </div>

        <div class="block">


            <div class="card avatar" id="avatar">
  
                    <picture>
        <source srcset="./foto/logo.avif" type="foto/avif">
        <source srcset="./foto/logo.webp" type="foto/webp">
        <img class="big_avatar" src="./foto/logo.jpg" alt="лицо">
    </picture>
                <button class="btn">Choose photo</button>
            </div>

            <div class="card info" id="info">
                <form class="perv">
                    <input type="text" placeholder="First name">
                    <input type="text" placeholder="Last name">
                    <input type="email" placeholder="Email">
                    <input type="tel" placeholder="Phone number">
                    <input type="text" placeholder="Address">
                    <input type="text" placeholder="FB link">
                    <button class="btn save">Save changes</button>
                </form>
            </div>


            <div class="card password" id="password">
                <form class="perv">
                    <input type="password" placeholder="Old password">
                    <input type="password" placeholder="New password">
                    <input type="password" placeholder="Repeat password">
                    <button class="btn save">Change password</button>
                </form>
            </div>

        </div>
    </main>

</div>
